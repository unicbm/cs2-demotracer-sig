name: Check Sig and Schema
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Recheck even if the game and product build are unchanged
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: sig-schema
  cancel-in-progress: false
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout validated checker
        uses: actions/checkout@v7
        with:
          ref: 51fb5319e559ce977c3c779b65b6366bf3196044
          path: .checker
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read current Steam and product builds
        id: version
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          $ErrorActionPreference = 'Stop'
          $steam = Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$steam.zip"
          Expand-Archive "$steam.zip" $steam
          & "$steam/steamcmd.exe" +quit *> "$steam/bootstrap.txt"
          if ($LASTEXITCODE -notin @(0, 7)) { $code = $LASTEXITCODE; Get-Content "$steam/bootstrap.txt" -Tail 60; throw "Steam bootstrap failed: $code" }
          & "$steam/steamcmd.exe" +login anonymous +app_info_update 1 +app_info_print 730 +quit *> "$steam/appinfo.txt"
          if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE; Get-Content "$steam/appinfo.txt" -Tail 60; throw "Steam app info query failed: $code" }
          "STEAMCMD=$steam" >> $env:GITHUB_ENV
          $env:APPINFO = "$steam/appinfo.txt"
          @'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {parseVdf} from './.checker/src/report.mjs';
          const text=readFileSync(process.env.APPINFO,'utf8');
          const start=text.search(/"730"\s*\{/);
          if(start<0) throw new Error('Steam did not return app 730');
          const tokens=[...text.slice(start).matchAll(/"(?:\\.|[^"\\])*"|[{}]/g)];
          let depth=0,end=-1;
          for(let i=1;i<tokens.length;i++) {
            if(tokens[i][0]==='{') depth++;
            if(tokens[i][0]==='}' && --depth===0){end=i;break;}
          }
          if(end<0) throw new Error('Incomplete Steam app info');
          const app=parseVdf(tokens.slice(0,end+1).map(t=>t[0]).join('\n'))['730'];
          const build=app.depots?.branches?.public?.buildid;
          if(!/^\d+$/.test(build??'')) throw new Error('Missing public Steam build');
          async function api(path){
            const response=await fetch('https://api.github.com/repos/'+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(30000)});
            if(!response.ok) throw new Error('GitHub metadata HTTP '+response.status);
            return response.json();
          }
          const release=await api('unicbm/demotracer/releases/latest');
          if(!/^v\d+\.\d+\.\d+$/.test(release.tag_name)) throw new Error('Invalid release version');
          const commit=(await api('unicbm/demotracer/commits/'+release.tag_name)).sha;
          const schemaCommit=(await api('CS2OpenDev/CS2OpenDev-SchemaTracker/commits/latest')).sha;
          const manifests=['2347770','2347771'].map(id=>app.depots[id]?.manifests?.public?.gid);
          if(manifests.some(id=>!/^\d+$/.test(id??''))) throw new Error('Windows depot manifests missing');
          const key=[build,...manifests,commit,schemaCommit,'light-v1'].join(':');
          const changed=process.env.FORCE==='true'||!readFileSync('README.md','utf8').includes('<!-- checked:'+key+' -->');
          const values={changed:String(changed),build,ref:release.tag_name,schemaCommit,content:manifests[0],binary:manifests[1],key};
          appendFileSync(process.env.GITHUB_OUTPUT,Object.entries(values).map(([k,v])=>k+'='+v+'\n').join(''));
          console.log('Steam build '+build+', DemoTracer '+release.tag_name+', recheck='+changed);
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Version detection failed' }
      - name: Download matching Schema and selected Steam files
        if: steps.version.outputs.changed == 'true'
        env:
          BUILD: ${{ steps.version.outputs.build }}
          SCHEMA_COMMIT: ${{ steps.version.outputs.schemaCommit }}
          CONTENT_MANIFEST: ${{ steps.version.outputs.content }}
          BINARY_MANIFEST: ${{ steps.version.outputs.binary }}
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'schema'
          New-Item -ItemType Directory $data | Out-Null
          $base = "https://raw.githubusercontent.com/CS2OpenDev/CS2OpenDev-SchemaTracker/$env:SCHEMA_COMMIT/artifacts/$env:BUILD/windows-x86_64"
          foreach ($name in @('provenance.json', 'entity_schema.json')) {
            Invoke-WebRequest "$base/$name" -OutFile "$data/$name"
          }
          $provenance = Get-Content "$data/provenance.json" -Raw | ConvertFrom-Json
          if ($provenance.buildId -ne $env:BUILD -or $provenance.platform -ne 'windows-x86_64') { throw 'Schema build/platform mismatch' }
          foreach ($pair in @(@(2347770, $env:CONTENT_MANIFEST), @(2347771, $env:BINARY_MANIFEST))) {
            $entry = @($provenance.steam.depots | Where-Object depotId -eq $pair[0])
            if ($entry.Count -ne 1 -or $entry[0].manifestId -ne $pair[1]) { throw "Schema depot manifest mismatch: $($pair[0])" }
          }
          $downloader = Join-Path $env:RUNNER_TEMP 'depotdownloader'
          Invoke-WebRequest 'https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-windows-x64.zip' -OutFile "$env:RUNNER_TEMP/downloader.zip"
          Expand-Archive "$env:RUNNER_TEMP/downloader.zip" $downloader
          $game = Join-Path $env:RUNNER_TEMP 'cs2-files'
          @('game/csgo/bin/win64/server.dll', 'game/bin/win64/engine2.dll', 'game/bin/win64/schemasystem.dll') | Set-Content "$data/binaries.txt"
          'game/csgo/steam.inf' | Set-Content "$data/content.txt"
          & "$downloader/DepotDownloader.exe" -app 730 -depot 2347771 -manifest $env:BINARY_MANIFEST -filelist "$data/binaries.txt" -dir $game
          if ($LASTEXITCODE -ne 0) { throw 'DLL download failed' }
          & "$downloader/DepotDownloader.exe" -app 730 -depot 2347770 -manifest $env:CONTENT_MANIFEST -filelist "$data/content.txt" -dir $game
          if ($LASTEXITCODE -ne 0) { throw 'Version file download failed' }
          '"AppState" { "appid" "730" "buildid" "' + $env:BUILD + '" }' | Set-Content "$data/appmanifest.acf"
          "GAME_DIR=$game" >> $env:GITHUB_ENV
          "SCHEMA_DATA=$data" >> $env:GITHUB_ENV
      - name: Check signatures and matching Schema
        if: steps.version.outputs.changed == 'true'
        working-directory: .checker
        env:
          SOURCE_REF: ${{ steps.version.outputs.ref }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
          SCHEMA_COMMIT: ${{ steps.version.outputs.schemaCommit }}
        run: |
          node --test
          if ($LASTEXITCODE -ne 0) { throw 'Checker tests failed' }
          $checkArgs = @('src/check.mjs', '--game-dir', $env:GAME_DIR, '--app-manifest', "$env:SCHEMA_DATA/appmanifest.acf", '--refs', $env:SOURCE_REF)
          node @checkArgs --prepare-schema
          if ($LASTEXITCODE -ne 0) { throw 'Schema inventory failed' }
          @'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const read=p=>JSON.parse(readFileSync(p,'utf8').replace(/^\uFEFF/,''));
          const data=process.env.SCHEMA_DATA, root=process.env.GAME_DIR;
          const provenance=read(data+'/provenance.json'), schema=read(data+'/entity_schema.json');
          if(schema.buildId!==process.env.EXPECTED_BUILD || schema.platform!=='windows-x86_64') throw new Error('Schema identity mismatch');
          const modules={};
          for(const [name,path] of Object.entries({server:'game/csgo/bin/win64/server.dll',engine2:'game/bin/win64/engine2.dll',schemasystem:'game/bin/win64/schemasystem.dll'})) {
            const hash=createHash('sha256').update(readFileSync(root+'/'+path)).digest('hex');
            const inputs=provenance.inputs.filter(f=>f.path===path);
            if(inputs.length!==1 || inputs[0].sha256!==hash) throw new Error('Schema DLL hash mismatch: '+name);
            modules[name]=hash;
          }
          const fields=read('.cache/schema-requests.json').map(([className,fieldName])=>{
            const matches=['server.dll','entity2.dll','!GlobalTypes'].map(module=>schema.classes.filter(c=>c.name===className && c.module===module)).find(list=>list.length)??[];
            if(matches.length>1) throw new Error('Ambiguous server class: '+className);
            const c=matches[0], f=c?.fields.find(f=>f.name===fieldName);
            const offset=f?Number(f.offset):null, classSize=c?Number(c.size):0;
            const status=!c?-1:!f?-3:Number.isInteger(offset)&&offset>=0&&offset<classSize?1:-4;
            return {className,fieldName,offset,classSize,status};
          });
          writeFileSync('.cache/schema.json',JSON.stringify({schemaVersion:1,capturedAt:provenance.steam.manifestCreatedUtc,provider:'CS2OpenDev/CS2OpenDev-SchemaTracker@'+process.env.SCHEMA_COMMIT,modules,fields}));
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Schema evidence validation failed' }
          node @checkArgs
          if ($LASTEXITCODE -notin @(0, 1)) { throw 'Check did not complete' }
          exit 0
      - name: Render README
        if: steps.version.outputs.changed == 'true'
        shell: bash
        env:
          RESULT: .checker/reports/latest.json
          README: README.md
          CHECK_KEY: ${{ steps.version.outputs.key }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.RESULT,'utf8'));
          if(report.sources.length!==1) throw new Error('Expected latest release only');
          const sources=report.sources;
          const escape=s=>String(s).replaceAll('|','\\|');
          const state=c=>!c?'—':({pass:'✅',fail:'❌',not_checked:'—'})[c.status];
          const schema=c=>c.name.startsWith('Schema: ');
          const signature=c=>!schema(c)&&c.status!=='not_checked';
          const counts=(s,p,status)=>s.checks.filter(c=>p(c)&&c.status===status).length;
          const lines=['# CS2 DemoTracer · Sig & Schema','',`CS2 **${report.game.patchVersion}** · Windows x64 · Build **${report.game.buildId}** · ${report.checkedAt}`,'',
          '| 源码 | Sig 正常 | Sig 失配 | Schema 正常 | Schema 失配 |','| --- | ---: | ---: | ---: | ---: |'];
          for(const s of sources) lines.push(`| [${escape(s.ref)}](https://github.com/unicbm/demotracer/tree/${s.commit}) | ${counts(s,signature,'pass')} | ${counts(s,signature,'fail')} | ${counts(s,schema,'pass')} | ${counts(s,schema,'fail')} |`);
          function table(title,predicate,isSchema=false){
            lines.push('',`### ${title}`,'',`| ${isSchema?'类 | 字段':'检查项'} | 结果 |`, `| --- ${isSchema?'| --- ':''}| --- |`);
            const keys=[...new Set(sources.flatMap(s=>s.checks.filter(predicate).map(c=>c.name)))].sort();
            for(const key of keys){
              const selected=sources.map(s=>s.checks.find(c=>c.name===key&&predicate(c)));
              const first=selected.findIndex(Boolean), c=selected[first];
              const url=`https://github.com/unicbm/demotracer/blob/${sources[first].commit}/${c.source}`;
              const name=isSchema?key.slice(8).replace('::',' | '):`[${escape(key)}](${url})`;
              lines.push(`| ${name} | ${selected.map(state).join(' | ')} |`);
            }
          }
          lines.push('','## Sig');
          for(const [title,path] of [['dtr-controller','/dtr-controller/'],['dtr-hider','/dtr-hider/'],['投掷物','demotracer-native.json'],['BotRandomizer','/BotRandomizer/']])
            table(title,c=>signature(c)&&c.source.includes(path));
          lines.push('','## Schema', '', `数据源：[CS2OpenDev SchemaTracker](https://github.com/${report.schema.provider.replace('@','/tree/')}) · 已核对 Build、manifest 和 DLL SHA-256。`);
          table('字段',schema,true);
          if(process.env.CHECK_KEY) lines.push('',`<!-- checked:${process.env.CHECK_KEY} -->`);
          writeFileSync(process.env.README,lines.join('\n')+'\n');
          JS
      - name: Update results
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Update latest Sig and Schema results'
          if ($LASTEXITCODE -ne 0) { throw 'Result commit failed' }
          git push
          if ($LASTEXITCODE -ne 0) { throw 'Result push failed' }

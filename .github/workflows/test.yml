name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: 5f891c9026230cce0fc0a3fc4b5fef1c467a1385
          path: .cache/hl2sdk
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build probe/SchemaProbe.csproj -c Release
      - run: cmake -S probe/native -B probe/native/build -A x64 -DHL2SDK=${{ github.workspace }}/.cache/hl2sdk
      - run: cmake --build probe/native/build --config Release
